[project]
name = "jevgrep"
version = "0.1.0"
description = "grep by meaning: filter any text stream with a yes/no question, judged line by line by TypeSafe's Jev."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "allebee" }]
keywords = ["grep", "logs", "cli", "typesafe", "jev", "semantic-filter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "typesafe-sdk>=0.7.1,<0.8",
]

[project.optional-dependencies]
explain = ["openai>=1.40"]

[project.scripts]
jevgrep = "jevgrep.cli:main"

[project.urls]
Homepage = "https://github.com/allebee/jevgrep"
Repository = "https://github.com/allebee/jevgrep"
Issues = "https://github.com/allebee/jevgrep/issues"
Benchmark = "https://github.com/allebee/jevgrep/blob/main/bench/results.md"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "openai>=1.40"]
bench = ["system-one-adapter[openai]>=0.2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
