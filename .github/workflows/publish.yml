name: Publish to PyPI

# Runs on a version tag (git tag v0.1.0 && git push origin v0.1.0). Uses PyPI trusted
# publishing: no API token is stored anywhere, PyPI trusts this workflow in the `pypi`
# environment of allebee/jevgrep.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag upstream
        with:
          python-version: "3.13"
      - name: Check that the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jevgrep-cli/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
